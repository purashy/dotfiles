# ─────────────────────────────────────────────
# Kitty — KDE Dark
# ─────────────────────────────────────────────

# Font
font_family      Caskaydia Cove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# ─────────────────────────────────────────────
# Colors
# ─────────────────────────────────────────────

foreground #D8DEE9
background #1B1E23

cursor            #7AA2F7
cursor_text_color #1B1E23

selection_foreground #FFFFFF
selection_background #3D4654

url_color #7AA2F7

# Black
color0  #242831
color8  #565F6D

# Red
color1  #F7768E
color9  #FF8A9B

# Green
color2  #9ECE6A
color10 #B4F27C

# Yellow
color3  #E0AF68
color11 #F2C477

# Blue
color4  #7AA2F7
color12 #8DB0FF

# Magenta
color5  #BB9AF7
color13 #C7A9FF

# Cyan
color6  #7DCFFF
color14 #8DE2FF

# White
color7  #C0CAF5
color15 #D8DEE9

# ─────────────────────────────────────────────
# Transparency
# ─────────────────────────────────────────────

background_opacity 0.94
background_blur 1

# ─────────────────────────────────────────────
# Window
# ─────────────────────────────────────────────

remember_window_size no

initial_window_width 100c
initial_window_height 25c

window_padding_width 8
window_margin_width 0

confirm_os_window_close 0

# KDE handles the window decorations
hide_window_decorations no

# ─────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────

cursor_shape beam
cursor_blink_interval 0.5

# ─────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────

scrollback_lines 10000

# ─────────────────────────────────────────────
# URLs
# ─────────────────────────────────────────────

url_style curly
open_url_with default

# ─────────────────────────────────────────────
# Wayland
# ─────────────────────────────────────────────

linux_display_server wayland

# ─────────────────────────────────────────────
# Performance
# ─────────────────────────────────────────────

repaint_delay 10
input_delay 0

# ─────────────────────────────────────────────
# Bell
# ─────────────────────────────────────────────

enable_audio_bell no
visual_bell_duration 0

# ─────────────────────────────────────────────
# Tabs
# ─────────────────────────────────────────────

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

active_tab_foreground   #FFFFFF
active_tab_background   #313640

inactive_tab_foreground #7F8795
inactive_tab_background #20242B

